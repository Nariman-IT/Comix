services:
  php:
    build:
      context: .
      dockerfile: infrastructure/dev/php/Dockerfile
      target: final
      args:
        USER_ID: ${USER_ID}
        GROUP_ID: ${GROUP_ID}
    image: ${PROJECT_NAME}-php:dev
    environment:
      APP_ENV: ${APP_ENV}
      APP_DEBUG: ${APP_DEBUG}
    volumes:
      - ./application:/var/www
      - ./infrastructure/dev/log/xdebug:/var/log/xdebug
    ports:
      - "${APP_PORT}:9000"

  nginx:
    volumes:
      - ./infrastructure/dev/nginx/default.conf:/etc/nginx/conf.d/default.conf

  database:
    ports:
      - "${POSTGRES_PORT}:5432"

  redis:
    ports:
      - "${REDIS_PORT}:6379"